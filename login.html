<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>良平堂 メンバーポータル</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --gold: #C4A35A; --dark: #2C2420; --cream: #F8F4ED;
  --serif: 'Shippori Mincho', serif; --sans: 'Noto Sans JP', sans-serif;
  --r: 10px; --rl: 14px;
}
html, body { min-height: 100vh; font-family: var(--sans); background: var(--dark); }
body { display: flex; align-items: center; justify-content: center; }
.login-box {
  background: rgba(255,255,255,0.04); border: 0.5px solid rgba(196,163,90,0.3);
  border-radius: var(--rl); padding: 48px 44px 44px;
  width: 100%; max-width: 360px; text-align: center;
  animation: fadeup 0.5s ease both;
}
@keyframes fadeup { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
.login-logo { width: 56px; height: 56px; border-radius: 50%; background: var(--gold); display: flex; align-items: center; justify-content: center; font-family: var(--serif); font-size: 22px; color: var(--dark); font-weight: 600; margin: 0 auto 20px; }
.login-title { font-family: var(--serif); font-size: 17px; color: var(--cream); font-weight: 500; letter-spacing: 0.05em; margin-bottom: 4px; }
.login-subtitle { font-size: 11px; color: var(--gold); font-weight: 300; letter-spacing: 0.1em; margin-bottom: 32px; }
.login-label { display: block; font-size: 11px; color: rgba(248,244,237,0.5); text-align: left; margin-bottom: 8px; letter-spacing: 0.08em; }
.login-input { width: 100%; padding: 12px 16px; background: rgba(255,255,255,0.06); border: 0.5px solid rgba(196,163,90,0.25); border-radius: var(--r); color: var(--cream); font-size: 14px; font-family: var(--sans); outline: none; transition: border-color 0.2s; margin-bottom: 20px; }
.login-input:focus { border-color: rgba(196,163,90,0.6); }
.login-input::placeholder { color: rgba(248,244,237,0.2); }
.login-btn { width: 100%; padding: 13px; background: var(--gold); border: none; border-radius: var(--r); color: var(--dark); font-size: 13px; font-family: var(--sans); font-weight: 500; cursor: pointer; letter-spacing: 0.06em; transition: opacity 0.2s, transform 0.1s; }
.login-btn:hover { opacity: 0.9; }
.login-btn:active { transform: scale(0.98); }
.login-error { font-size: 12px; color: #F09595; margin-top: 14px; min-height: 18px; }
@media (max-width: 480px) { .login-box { margin: 24px; padding: 36px 28px 32px; } }
</style>
</head>
<body>
<div class="login-box">
  <div class="login-logo">良</div>
  <div class="login-title">恵那栗工房 良平堂</div>
  <div class="login-subtitle">MEMBER PORTAL</div>
  <form id="login-form" method="post" action="#" autocomplete="on">
    <label class="login-label">パスワード</label>
    <input type="password" id="login-pw" name="password" class="login-input" placeholder="••••••••" autocomplete="current-password">
    <button type="submit" class="login-btn">ログイン</button>
  </form>
  <div class="login-error" id="login-error"></div>
</div>
<script>
(function () {
  var PASSWORD = 'ryoheido2026';
  if (sessionStorage.getItem('rh_auth') === '1') {
    location.replace('index.html');
  }
  document.getElementById('login-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var input = document.getElementById('login-pw').value;
    var err = document.getElementById('login-error');
    if (!input) { err.textContent = 'パスワードを入力してください'; return; }
    if (input === PASSWORD) {
      sessionStorage.setItem('rh_auth', '1');
      // フォームをネイティブsubmitさせてからリダイレクト（パスワード保存ダイアログを促す）
      document.getElementById('login-form').removeEventListener('submit', arguments.callee);
      setTimeout(function () { location.href = 'index.html'; }, 100);
    } else {
      err.textContent = 'パスワードが正しくありません';
      document.getElementById('login-pw').value = '';
      document.getElementById('login-pw').focus();
    }
  });
})();
</script>
</body>
</html>
